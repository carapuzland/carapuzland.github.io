<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✂️ AI BG Remover</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#f0f4f8;--card:#fff;--pri:#ec4899;--tx:#1e293b;--bor:#e2e8f0;--r:16px}
[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--bor:#334155}
body{font-family:sans-serif;background:var(--bg);color:var(--tx);margin:0;transition:.3s}
.hdr{background:linear-gradient(135deg,#4c1d95,#ec4899);color:#fff;padding:1.5rem 7rem;text-align:center;position:relative}
.hdr-home{position:absolute;top:1rem;left:1rem;width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;border-radius:12px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);box-shadow:0 8px 18px rgba(0,0,0,.16);backdrop-filter:blur(8px);transition:.2s}
.hdr-home svg{width:24px;height:24px;display:block;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.hdr-home:hover{transform:translateY(-2px);background:rgba(255,255,255,.24)}
.hdr-btns{position:absolute;top:1rem;right:1rem;display:flex;gap:.5rem}
.hdr-btns select,.hdr-btns button{background:rgba(0,0,0,.2);color:#fff;border:none;border-radius:8px;padding:.5rem;cursor:pointer}
@media(max-width:640px){.hdr{padding:4.25rem 1rem 1.25rem}.hdr-home{top:.85rem;left:.85rem}.hdr-btns{top:.85rem;right:.85rem}}
.wrap{max-width:900px;margin:2rem auto;padding:0 1rem}
.drop{border:3px dashed var(--bor);padding:3rem 1rem;text-align:center;border-radius:var(--r);background:var(--card);cursor:pointer;position:relative}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.editor{display:none;background:var(--card);padding:1.5rem;border-radius:var(--r);text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.1)}
.canvas-wrap{background-image:linear-gradient(45deg,#ccc 25%,transparent 25%),linear-gradient(-45deg,#ccc 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ccc 75%),linear-gradient(-45deg,transparent 75%,#ccc 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;display:inline-block;border-radius:8px;border:1px solid var(--bor);overflow:hidden}
canvas{max-width:100%;display:block;cursor:crosshair}
.tools{display:flex;gap:1rem;justify-content:center;margin:1rem 0;flex-wrap:wrap;align-items:center}
.btn{padding:.8rem 1.5rem;background:var(--pri);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold;transition:.2s}
.btn.active{box-shadow:0 0 0 3px var(--tx)}
.btn.out{background:transparent;border:2px solid var(--bor);color:var(--tx)}
#prog{height:8px;background:var(--bor);border-radius:4px;margin-top:1rem;overflow:hidden;display:none}
#fill{height:100%;background:var(--pri);width:0%}
</style>
<script type="module">
  import imglyRemoveBackground from "https://esm.sh/@imgly/background-removal@1.4.3?bundle";
  window.imglyRemoveBackground = imglyRemoveBackground;
</script>
<script src="/assets/site-icons.js" defer></script>
</head>
<body>
<div class="hdr">
  <a class="hdr-home" href="https://carapuzland.github.io/" title="CarapuzLand" aria-label="CarapuzLand">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
  </a>
  <div class="hdr-btns">
    <select id="langSel" onchange="chLang(this.value)"><option value="en-gb">EN-GB</option><option value="en-us">EN-US</option><option value="uk">UK</option><option value="ru">RU</option><option value="be">BE</option><option value="bg">BG</option><option value="hr">HR</option><option value="cs">CS</option><option value="da">DA</option><option value="nl">NL</option><option value="et">ET</option><option value="fi">FI</option><option value="fr">FR</option><option value="de">DE</option><option value="el">EL</option><option value="hu">HU</option><option value="ga">GA</option><option value="it">IT</option><option value="lv">LV</option><option value="lt">LT</option><option value="mt">MT</option><option value="pl">PL</option><option value="pt">PT</option><option value="ro">RO</option><option value="sk">SK</option><option value="sl">SL</option><option value="es">ES</option><option value="sv">SV</option></select>
    <button onclick="document.documentElement.setAttribute('data-theme',document.documentElement.getAttribute('data-theme')==='dark'?'':'dark');localStorage.setItem('bgTheme',document.documentElement.getAttribute('data-theme'))">🌓</button>
  </div>
  <h1 id="tTitle">✂️ AI Background Remover</h1>
</div>

<div class="wrap">
  <div class="drop" id="dropZ">
    <h2 id="tDrop">Drop image here or click</h2>
    <p id="tSub">100% Free · Runs locally in browser</p>
    <input type="file" id="fi" accept="image/*">
  </div>

  <div id="loader" style="display:none;text-align:center;margin:2rem">
    <h2 id="tLoad">Loading AI...</h2>
    <div id="prog"><div id="fill"></div></div>
  </div>

  <div class="editor" id="editor">
    <h3 id="tEdit">Draw to edit mask</h3>
    <div class="tools">
      <button class="btn active" id="bErase" onclick="setMode('erase')">🔴 Erase</button>
      <button class="btn out" id="bRestore" onclick="setMode('restore')">🟢 Restore</button>
      <label><span id="tSize">Size</span>: <input type="range" id="brushSize" min="5" max="100" value="30"></label>
    </div>
    <div class="canvas-wrap"><canvas id="cvs"></canvas></div>
    <div class="tools">
      <button class="btn" id="bSave" onclick="download()">💾 Download PNG</button>
      <button class="btn out" id="bNew" onclick="location.reload()">🔄 New Image</button>
    </div>
  </div>
</div>

<script>
if(localStorage.getItem('bgTheme')==='dark') document.documentElement.setAttribute('data-theme','dark');
const TR={
  en:{title:'✂️ AI BG Remover',drop:'Drop image here or click',sub:'100% free · runs locally in browser · paste supported',load:'Processing...',erase:'🔴 Erase',restore:'🟢 Restore',save:'💾 Download PNG',edit:'Draw to edit mask',size:'Size',next:'🔄 New Image',err:'Background removal failed'},
  uk:{title:'✂️ Видалення фону',drop:'Киньте фото сюди або натисніть',sub:'100% безкоштовно · працює локально в браузері · підтримує вставлення',load:'Обробка...',erase:'🔴 Стерти',restore:'🟢 Відновити',save:'💾 Завантажити PNG',edit:'Малюйте для редагування маски',size:'Розмір',next:'🔄 Нове зображення',err:'Не вдалося видалити фон'},
  ru:{title:'✂️ Удаление фона',drop:'Бросьте фото сюда или нажмите',sub:'100% бесплатно · работает локально в браузере · поддерживает вставку',load:'Обработка...',erase:'🔴 Стереть',restore:'🟢 Восстановить',save:'💾 Скачать PNG',edit:'Рисуйте для правки маски',size:'Размер',next:'🔄 Новое изображение',err:'Не удалось удалить фон'},
  de:{title:'✂️ Hintergrund entfernen',drop:'Bild hier ablegen oder klicken',sub:'100% kostenlos · läuft lokal im Browser · Einfügen unterstützt',load:'Wird verarbeitet...',erase:'🔴 Entfernen',restore:'🟢 Wiederherstellen',save:'💾 PNG herunterladen',edit:'Maske zum Bearbeiten zeichnen',size:'Größe',next:'🔄 Neues Bild',err:'Hintergrund konnte nicht entfernt werden'},
  fr:{title:'✂️ Supprimer le fond',drop:'Déposez une image ou cliquez',sub:'100% gratuit · local dans le navigateur · collage pris en charge',load:'Traitement...',erase:'🔴 Effacer',restore:'🟢 Restaurer',save:'💾 Télécharger PNG',edit:'Dessinez pour modifier le masque',size:'Taille',next:'🔄 Nouvelle image',err:'La suppression du fond a échoué'},
  es:{title:'✂️ Quitar fondo',drop:'Suelta una imagen o haz clic',sub:'100% gratis · local en el navegador · admite pegar',load:'Procesando...',erase:'🔴 Borrar',restore:'🟢 Restaurar',save:'💾 Descargar PNG',edit:'Dibuja para editar la máscara',size:'Tamaño',next:'🔄 Nueva imagen',err:'No se pudo quitar el fondo'},
  it:{title:'✂️ Rimuovi sfondo',drop:'Trascina un’immagine o clicca',sub:'100% gratis · locale nel browser · incolla supportato',load:'Elaborazione...',erase:'🔴 Cancella',restore:'🟢 Ripristina',save:'💾 Scarica PNG',edit:'Disegna per modificare la maschera',size:'Dimensione',next:'🔄 Nuova immagine',err:'Rimozione sfondo non riuscita'},
  pl:{title:'✂️ Usuwanie tła',drop:'Upuść obraz lub kliknij',sub:'100% za darmo · lokalnie w przeglądarce · obsługa wklejania',load:'Przetwarzanie...',erase:'🔴 Usuń',restore:'🟢 Przywróć',save:'💾 Pobierz PNG',edit:'Rysuj, aby edytować maskę',size:'Rozmiar',next:'🔄 Nowy obraz',err:'Nie udało się usunąć tła'},
  pt:{title:'✂️ Remover fundo',drop:'Solte uma imagem ou clique',sub:'100% grátis · local no navegador · colar suportado',load:'Processando...',erase:'🔴 Apagar',restore:'🟢 Restaurar',save:'💾 Baixar PNG',edit:'Desenhe para editar a máscara',size:'Tamanho',next:'🔄 Nova imagem',err:'Falha ao remover o fundo'},
  nl:{title:'✂️ Achtergrond verwijderen',drop:'Sleep een afbeelding of klik',sub:'100% gratis · lokaal in de browser · plakken ondersteund',load:'Verwerken...',erase:'🔴 Wissen',restore:'🟢 Herstellen',save:'💾 PNG downloaden',edit:'Teken om het masker te bewerken',size:'Grootte',next:'🔄 Nieuwe afbeelding',err:'Achtergrond verwijderen mislukt'},
  ro:{title:'✂️ Eliminare fundal',drop:'Trage o imagine aici sau apasă',sub:'100% gratuit · local în browser · lipire acceptată',load:'Se procesează...',erase:'🔴 Șterge',restore:'🟢 Restaurează',save:'💾 Descarcă PNG',edit:'Desenează pentru a edita masca',size:'Dimensiune',next:'🔄 Imagine nouă',err:'Eliminarea fundalului a eșuat'},
  sv:{title:'✂️ Ta bort bakgrund',drop:'Släpp en bild här eller klicka',sub:'100% gratis · körs lokalt i webbläsaren · klistra in stöds',load:'Bearbetar...',erase:'🔴 Radera',restore:'🟢 Återställ',save:'💾 Ladda ned PNG',edit:'Rita för att redigera masken',size:'Storlek',next:'🔄 Ny bild',err:'Bakgrunden kunde inte tas bort'},
  cs:{title:'✂️ Odstranit pozadí',drop:'Přetáhněte obrázek nebo klikněte',sub:'100% zdarma · lokálně v prohlížeči · podporuje vložení',load:'Zpracování...',erase:'🔴 Vymazat',restore:'🟢 Obnovit',save:'💾 Stáhnout PNG',edit:'Kreslením upravíte masku',size:'Velikost',next:'🔄 Nový obrázek',err:'Odstranění pozadí selhalo'},
  hu:{title:'✂️ Háttér eltávolítása',drop:'Húzz ide egy képet vagy kattints',sub:'100% ingyenes · helyben fut a böngészőben · beillesztés támogatott',load:'Feldolgozás...',erase:'🔴 Törlés',restore:'🟢 Visszaállítás',save:'💾 PNG letöltése',edit:'Rajzzal szerkeszd a maszkot',size:'Méret',next:'🔄 Új kép',err:'A háttér eltávolítása sikertelen'},
  el:{title:'✂️ Αφαίρεση φόντου',drop:'Σύρετε εικόνα εδώ ή κάντε κλικ',sub:'100% δωρεάν · τοπικά στο πρόγραμμα περιήγησης · υποστήριξη επικόλλησης',load:'Επεξεργασία...',erase:'🔴 Διαγραφή',restore:'🟢 Επαναφορά',save:'💾 Λήψη PNG',edit:'Σχεδιάστε για επεξεργασία μάσκας',size:'Μέγεθος',next:'🔄 Νέα εικόνα',err:'Η αφαίρεση φόντου απέτυχε'}
};
Object.assign(TR,{
  'en-gb':{...TR.en,title:'✂️ AI Background Remover'},
  'en-us':{...TR.en,title:'✂️ AI Background Remover'},
  be:{title:'✂️ Выдаленне фону',drop:'Перацягніце выяву сюды або націсніце',sub:'100% бясплатна · працуе лакальна ў браўзеры · падтрымлівае ўстаўку',load:'Апрацоўка...',erase:'🔴 Сцерці',restore:'🟢 Аднавіць',save:'💾 Спампаваць PNG',edit:'Малюйце, каб змяніць маску',size:'Памер',next:'🔄 Новая выява',err:'Не ўдалося выдаліць фон'},
  bg:{title:'✂️ Премахване на фон',drop:'Пуснете изображение тук или кликнете',sub:'100% безплатно · работи локално в браузъра · поддържа поставяне',load:'Обработка...',erase:'🔴 Изтрий',restore:'🟢 Възстанови',save:'💾 Изтегли PNG',edit:'Рисувайте, за да редактирате маската',size:'Размер',next:'🔄 Ново изображение',err:'Премахването на фона не успя'},
  hr:{title:'✂️ Uklanjanje pozadine',drop:'Ispustite sliku ovdje ili kliknite',sub:'100% besplatno · radi lokalno u pregledniku · podržava lijepljenje',load:'Obrada...',erase:'🔴 Izbriši',restore:'🟢 Vrati',save:'💾 Preuzmi PNG',edit:'Crtajte za uređivanje maske',size:'Veličina',next:'🔄 Nova slika',err:'Uklanjanje pozadine nije uspjelo'},
  da:{title:'✂️ Fjern baggrund',drop:'Slip billede her eller klik',sub:'100% gratis · kører lokalt i browseren · indsæt understøttet',load:'Behandler...',erase:'🔴 Slet',restore:'🟢 Gendan',save:'💾 Download PNG',edit:'Tegn for at redigere masken',size:'Størrelse',next:'🔄 Nyt billede',err:'Fjernelse af baggrund mislykkedes'},
  et:{title:'✂️ Tausta eemaldamine',drop:'Lohista pilt siia või klõpsa',sub:'100% tasuta · töötab brauseris kohapeal · kleepimine toetatud',load:'Töötlemine...',erase:'🔴 Kustuta',restore:'🟢 Taasta',save:'💾 Laadi PNG alla',edit:'Maski muutmiseks joonista',size:'Suurus',next:'🔄 Uus pilt',err:'Tausta eemaldamine ebaõnnestus'},
  fi:{title:'✂️ Taustan poisto',drop:'Pudota kuva tähän tai klikkaa',sub:'100% ilmainen · toimii paikallisesti selaimessa · liittäminen tuettu',load:'Käsitellään...',erase:'🔴 Poista',restore:'🟢 Palauta',save:'💾 Lataa PNG',edit:'Muokkaa maskia piirtämällä',size:'Koko',next:'🔄 Uusi kuva',err:'Taustan poisto epäonnistui'},
  ga:{title:'✂️ Bain cúlra',drop:'Scaoil íomhá anseo nó cliceáil',sub:'100% saor in aisce · ritheann sé go háitiúil sa bhrabhsálaí · tacaítear le greamú',load:'Á phróiseáil...',erase:'🔴 Scrios',restore:'🟢 Athchóirigh',save:'💾 Íoslódáil PNG',edit:'Tarraing chun an masc a chur in eagar',size:'Méid',next:'🔄 Íomhá nua',err:'Theip ar bhaint an chúlra'},
  lv:{title:'✂️ Fona noņemšana',drop:'Nometiet attēlu šeit vai klikšķiniet',sub:'100% bez maksas · darbojas lokāli pārlūkā · atbalsta ielīmēšanu',load:'Apstrāde...',erase:'🔴 Dzēst',restore:'🟢 Atjaunot',save:'💾 Lejupielādēt PNG',edit:'Zīmējiet, lai labotu masku',size:'Izmērs',next:'🔄 Jauns attēls',err:'Fona noņemšana neizdevās'},
  lt:{title:'✂️ Fono šalinimas',drop:'Įmeskite vaizdą čia arba spustelėkite',sub:'100% nemokamai · veikia lokaliai naršyklėje · palaiko įklijavimą',load:'Apdorojama...',erase:'🔴 Ištrinti',restore:'🟢 Atkurti',save:'💾 Atsisiųsti PNG',edit:'Pieškite, kad redaguotumėte kaukę',size:'Dydis',next:'🔄 Naujas vaizdas',err:'Fono pašalinti nepavyko'},
  mt:{title:'✂️ Neħħi l-isfond',drop:'Waqqa stampa hawn jew ikklikkja',sub:'100% b’xejn · jaħdem lokalment fil-browser · paste appoġġjat',load:'Qed jiġi pproċessat...',erase:'🔴 Ħassar',restore:'🟢 Irrestawra',save:'💾 Niżżel PNG',edit:'Pinġi biex teditja l-maskra',size:'Daqs',next:'🔄 Stampa ġdida',err:'It-tneħħija tal-isfond falliet'},
  sk:{title:'✂️ Odstránenie pozadia',drop:'Presuňte obrázok sem alebo kliknite',sub:'100% zadarmo · beží lokálne v prehliadači · podporuje vloženie',load:'Spracovanie...',erase:'🔴 Vymazať',restore:'🟢 Obnoviť',save:'💾 Stiahnuť PNG',edit:'Kreslením upravte masku',size:'Veľkosť',next:'🔄 Nový obrázok',err:'Odstránenie pozadia zlyhalo'},
  sl:{title:'✂️ Odstranjevanje ozadja',drop:'Spustite sliko sem ali kliknite',sub:'100% brezplačno · deluje lokalno v brskalniku · podpira lepljenje',load:'Obdelava...',erase:'🔴 Izbriši',restore:'🟢 Obnovi',save:'💾 Prenesi PNG',edit:'Rišite za urejanje maske',size:'Velikost',next:'🔄 Nova slika',err:'Odstranjevanje ozadja ni uspelo'}
});
const savedBgLang=localStorage.getItem('bgLang');
let lang=savedBgLang==='en'?'en-gb':(TR[savedBgLang]?savedBgLang:'en-gb');
const $=id=>document.getElementById(id);
const t=k=>TR[lang][k];

function chLang(l){lang=TR[l]?l:'en-gb';localStorage.setItem('bgLang',lang);applyUI()}
function applyUI(){
  document.documentElement.lang=lang;
  $('langSel').value=lang; $('tTitle').textContent=t('title'); $('tDrop').textContent=t('drop');
  $('tSub').textContent=t('sub'); $('tLoad').textContent=t('load'); $('bErase').textContent=t('erase');
  $('bRestore').textContent=t('restore'); $('bSave').textContent=t('save'); $('tEdit').textContent=t('edit');
  $('tSize').textContent=t('size'); $('bNew').textContent=t('next');
}

let origImg=null, maskImg=null, mode='erase', isDraw=false;
const cvs=$('cvs'), ctx=cvs.getContext('2d');

async function loadFile(f){
  if(!f)return;
  $('dropZ').style.display='none'; $('loader').style.display='block'; $('prog').style.display='block';

  origImg=new Image(); origImg.src=URL.createObjectURL(f);
  await new Promise(r=>origImg.onload=r);

  try{
    const blob = await window.imglyRemoveBackground(f, {
      publicPath: 'https://staticimgly.com/@imgly/background-removal-data/1.4.3/dist/',
      progress: (k, c, tot) => {
        if(String(k).includes('fetch') && tot) $('fill').style.width=(c/tot*100)+'%';
      }
    });

    maskImg=new Image(); maskImg.src=URL.createObjectURL(blob);
    await new Promise(r=>maskImg.onload=r);

    $('loader').style.display='none'; $('editor').style.display='block';
    cvs.width=origImg.width; cvs.height=origImg.height;
    ctx.drawImage(maskImg,0,0);
  }catch(err){alert(`${t('err')}: ${err.message}`); location.reload();}
}

$('fi').onchange=e=>loadFile(e.target.files[0]);

['dragenter','dragover'].forEach(ev=>$('dropZ').addEventListener(ev,e=>{
  e.preventDefault(); $('dropZ').style.borderColor='var(--pri)';
}));
['dragleave','drop'].forEach(ev=>$('dropZ').addEventListener(ev,e=>{
  e.preventDefault(); $('dropZ').style.borderColor='var(--bor)';
}));
$('dropZ').addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));

document.addEventListener('paste', e=>{
  const items=e.clipboardData.items;
  for(let i=0;i<items.length;i++){
    if(items[i].type.startsWith('image/')){
      const file=items[i].getAsFile();
      const dt=new DataTransfer(); dt.items.add(file); $('fi').files=dt.files;
      loadFile(file); break;
    }
  }
});

function setMode(m){
  mode=m; $('bErase').className=`btn ${m==='erase'?'active':'out'}`; $('bRestore').className=`btn ${m==='restore'?'active':'out'}`;
}

function getPos(e){
  const rect=cvs.getBoundingClientRect(); const scaleX=cvs.width/rect.width; const scaleY=cvs.height/rect.height;
  return {x:(e.clientX-rect.left)*scaleX, y:(e.clientY-rect.top)*scaleY};
}

cvs.onmousedown=e=>{isDraw=true; draw(e)};
cvs.onmousemove=e=>{if(isDraw)draw(e)};
window.onmouseup=()=>isDraw=false;

function draw(e){
  const pos=getPos(e); const size=+$('brushSize').value;
  ctx.beginPath(); ctx.arc(pos.x, pos.y, size, 0, Math.PI*2);
  if(mode==='erase'){
    ctx.globalCompositeOperation='destination-out'; ctx.fill();
  } else {
    ctx.globalCompositeOperation='source-over'; ctx.save(); ctx.clip(); ctx.drawImage(origImg,0,0); ctx.restore();
  }
}

function download(){const a=document.createElement('a');a.download='nobg.png';a.href=cvs.toDataURL('image/png');a.click();}
applyUI();
</script>
</body>
</html>
