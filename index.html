<html lang="en" data-theme="dark">
<head>

    <style>
        :root { --transition-speed: 0.4s; }

        [data-theme="dark"] {
            --bg-primary: #020617;
            --bg-secondary: #0a0f1e;
            --bg-card: rgba(15, 23, 42, 0.8);
            --bg-header: rgba(2, 6, 23, 0.95);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-accent: #38bdf8;
            --ocean-top: #020617;
            --ocean-mid: #05162d;
            --ocean-bottom: #000000;
            --border-color: rgba(56, 189, 248, 0.15);
            --shadow-color: rgba(0, 0, 0, 0.8);
            --dropdown-bg: #1e293b;
            --dropdown-hover: #334155;
            --glow: rgba(56, 189, 248, 0.3);
            --star-color: #ffffff;
            --cloud-color: rgba(255,255,255,0.02);
            --foam-color: rgba(255,255,255,0.1);
            --hero-gradient: linear-gradient(to bottom, #ffffff, var(--text-accent));
        }

        [data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f0f9ff;
            --bg-card: rgba(255, 255, 255, 0.9);
            --bg-header: rgba(255, 255, 255, 0.9);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-accent: #0284c7;
            --ocean-top: #ffffff;
            --ocean-mid: #bae6fd;
            --ocean-bottom: #7dd3fc;
            --border-color: rgba(2, 132, 199, 0.15);
            --shadow-color: rgba(0, 50, 100, 0.1);
            --dropdown-bg: #ffffff;
            --dropdown-hover: #f1f5f9;
            --glow: rgba(2, 132, 199, 0.2);
            --star-color: transparent;
            --cloud-color: rgba(255, 255, 255, 0.8);
            --foam-color: rgba(2, 132, 199, 0.3);
            --hero-gradient: linear-gradient(to bottom, #0f172a, #0369a1);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary); color: var(--text-primary);
            overflow-x: hidden; min-height: 100vh;
            transition: background var(--transition-speed), color var(--transition-speed);
        }

        /* ============ HEADER ============ */
        .header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            background: var(--bg-header); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 0 5%; height: 64px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .header-logo {
            display: flex; align-items: center; gap: 0.75rem;
            font-size: 1.4rem; font-weight: 800; color: var(--text-primary);
            text-decoration: none;
        }
        .header-logo i { color: var(--text-accent); animation: float-logo 3s ease-in-out infinite; }
        @keyframes float-logo { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

        .header-controls { display: flex; align-items: center; gap: 0.75rem; }
        .btn-control {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 12px; width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s; color: var(--text-primary);
        }
        .btn-control:hover { border-color: var(--text-accent); box-shadow: 0 0 12px var(--glow); }

        /* ============ LANGUAGE ============ */
        .lang-dropdown { position: relative; }
        .lang-btn {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 0 1rem; height: 40px; cursor: pointer;
            display: flex; align-items: center; gap: 0.5rem;
            font-size: 0.9rem; color: var(--text-primary); transition: 0.3s;
        }
        .lang-menu {
            position: absolute; top: calc(100% + 8px); right: 0;
            background: var(--dropdown-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 0.5rem 0; min-width: 220px;
            max-height: 400px; overflow-y: auto; opacity: 0; visibility: hidden;
            transform: translateY(-10px); transition: 0.3s;
            box-shadow: 0 20px 40px var(--shadow-color); z-index: 1001;
        }
        .lang-menu.show { opacity: 1; visibility: visible; transform: translateY(0); }
        .lang-menu::-webkit-scrollbar { width: 6px; }
        .lang-menu::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        .lang-option {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.55rem 1rem; cursor: pointer; transition: 0.2s;
            font-size: 0.88rem; color: var(--text-primary);
        }
        .lang-option:hover { background: var(--dropdown-hover); }
        .lang-option.active { color: var(--text-accent); font-weight: 600; }

        /* ============ OCEAN SCENE ============ */
        .ocean-scene {
            position: relative; width: 100%; min-height: 100vh;
            background: linear-gradient(180deg, var(--ocean-top) 0%, var(--ocean-mid) 45%, var(--ocean-bottom) 100%);
            padding-top: 64px; overflow: hidden; transition: background 0.8s ease;
        }

        .stars-container { position: absolute; top: 0; left: 0; width: 100%; height: 50%; pointer-events: none; }
        .star {
            position: absolute; background: var(--star-color); border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite; opacity: 0;
        }
        @keyframes twinkle { 0%, 100% { opacity: 0; } 50% { opacity: var(--max-opacity); } }

        .clouds-container { position: absolute; top: 5%; left: 0; width: 100%; height: 30%; pointer-events: none; }
        .cloud {
            position: absolute; background: var(--cloud-color); border-radius: 50%;
            filter: blur(50px); animation: drift linear infinite;
        }
        @keyframes drift { from { transform: translateX(-400px); } to { transform: translateX(calc(100vw + 400px)); } }

        /* ============ HERO ============ */
        .hero {
            position: relative; z-index: 10; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
            padding: 6rem 2rem 3rem; min-height: 60vh;
        }
        .hero-icon {
            color: var(--text-accent); margin-bottom: 2rem;
            filter: drop-shadow(0 0 25px var(--glow));
            animation: hero-bounce 4s ease-in-out infinite;
        }
        @keyframes hero-bounce {
            0%, 100% { transform: translateY(0) rotate(-4deg); }
            50% { transform: translateY(-20px) rotate(4deg); }
        }
        .hero-title {
            font-size: clamp(2.8rem, 9vw, 5rem); font-weight: 900; margin-bottom: 1.2rem;
            background: var(--hero-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }
        .hero-subtitle {
            font-size: 1.2rem; color: var(--text-secondary);
            max-width: 650px; line-height: 1.7; font-weight: 500;
        }

        /* ============ GRID ============ */
        .islands-section { position: relative; z-index: 10; padding: 4rem 2rem 8rem; }
        .islands-title {
            text-align: center; font-size: 2rem; font-weight: 800;
            margin-bottom: 3.5rem; letter-spacing: 1px; color: var(--text-primary);
        }
        .islands-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem; max-width: 1200px; margin: 0 auto;
        }

        /* ============ ISLAND CARD ============ */
        .island-card {
            background: var(--bg-card); backdrop-filter: blur(15px);
            border: 1px solid var(--border-color); border-radius: 32px;
            padding: 3rem 2.5rem; text-decoration: none; color: inherit;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; flex-direction: column; gap: 1.2rem;
            position: relative; overflow: hidden;
            box-shadow: 0 10px 30px var(--shadow-color);
        }
        .island-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--card-accent, var(--text-accent)), transparent);
            opacity: 0; transition: opacity 0.4s;
        }
        .island-card:hover::before { opacity: 1; }
        .island-card:hover {
            transform: translateY(-15px); border-color: var(--text-accent);
            box-shadow: 0 40px 80px var(--shadow-color);
        }

        .card-icon { width: 50px; height: 50px; color: var(--text-accent); margin-bottom: 0.5rem; transition: 0.3s; }
        .card-title { font-size: 1.6rem; font-weight: 800; }
        .card-desc { color: var(--text-secondary); font-size: 1rem; line-height: 1.6; }
        .card-tag {
            background: rgba(56, 189, 248, 0.1); color: var(--text-accent);
            padding: 6px 14px; border-radius: 100px; font-size: 0.8rem;
            font-weight: 700; width: fit-content; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .island-card.is-placeholder { cursor: default; }
        .island-card.is-placeholder::after {
            content: "WIP";
            position: absolute; top: 1.2rem; right: 1.2rem;
            padding: 0.25rem 0.55rem; border-radius: 999px;
            color: var(--card-accent);
            background: color-mix(in srgb, var(--card-accent) 16%, transparent);
            border: 1px solid color-mix(in srgb, var(--card-accent) 30%, transparent);
            font-size: 0.68rem; font-weight: 900; letter-spacing: 0.08em;
        }

        /* Специальная подсветка для CAI */
        .island-card[data-id="cai"] .card-icon {
            animation: ai-pulse 2s ease-in-out infinite;
        }
        @keyframes ai-pulse {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(192, 132, 252, 0.3)); }
            50% { filter: drop-shadow(0 0 20px rgba(192, 132, 252, 0.8)); }
        }

        /* ============ VISUAL EXTRAS ============ */
        .mini-island { position: absolute; pointer-events: none; opacity: 0.2; animation: mini-float var(--speed) linear infinite; }
        @keyframes mini-float { 0%, 100% { transform: translate(0,0) rotate(0); } 50% { transform: translate(40px, -30px) rotate(15deg); } }

        /* ============ FOOTER ============ */
        .footer {
            background: #000; padding: 6rem 2rem; text-align: center;
            border-top: 1px solid var(--border-color); position: relative; z-index: 10;
        }
        .footer p { color: var(--text-secondary); margin-bottom: 1rem; }
        .footer a { color: var(--text-accent); text-decoration: none; font-weight: 700; }

        /* ============ LOADER ============ */
        .page-loader {
            position: fixed; inset: 0; background: var(--bg-primary); z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 2rem; transition: 0.6s;
        }
        .page-loader.hidden { opacity: 0; visibility: hidden; }
        .status-toast {
            position: fixed; left: 50%; bottom: 1.5rem;
            transform: translate(-50%, 18px); z-index: 10001;
            max-width: min(420px, calc(100vw - 2rem));
            padding: 0.85rem 1rem; border-radius: 14px;
            color: var(--text-primary); background: var(--bg-header);
            border: 1px solid var(--border-color);
            box-shadow: 0 18px 50px var(--shadow-color);
            backdrop-filter: blur(18px);
            opacity: 0; pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
            text-align: center; font-size: 0.92rem; line-height: 1.45;
        }
        .status-toast.show { opacity: 1; transform: translate(-50%, 0); }

        .ripple {
            position: fixed; width: 10px; height: 10px; border: 2px solid var(--text-accent);
            border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%);
            animation: ripple-out 0.8s ease-out forwards; z-index: 9999;
        }
        @keyframes ripple-out { to { width: 150px; height: 150px; opacity: 0; } }

        @media (max-width: 768px) {
            .hero-title { font-size: 2.5rem; }
            .islands-grid { grid-template-columns: 1fr; }
            .lang-label { display: none; }
        }
    </style>
</head>

let currentLang = localStorage.getItem('cl-lang') || 'en-gb';
let currentTheme = localStorage.getItem('cl-theme') || 'dark';

const CAI_PLACEHOLDER = {
    "en-gb": {
        desc: "Work is in progress. This section will open when the CAI project is ready.",
        tag: "Work in progress",
        toast: "CAI is still in progress. The section will appear here later."
    },
    ru: {
        desc: "Работа идет. Раздел откроется, когда проект CAI будет готов.",
        tag: "В работе",
        toast: "CAI пока в работе. Раздел появится здесь позже."
    },
    uk: {
        desc: "Робота триває. Розділ відкриється, коли проєкт CAI буде готовий.",
        tag: "В роботі",
        toast: "CAI поки в роботі. Розділ з'явиться тут пізніше."
    }
};

function refreshLucideIcons() {
    if (window.lucide) lucide.createIcons();
}

function caiPlaceholderText() {
    return CAI_PLACEHOLDER[currentLang] || CAI_PLACEHOLDER["en-gb"];
}

document.addEventListener('DOMContentLoaded', () => {
    refreshLucideIcons();
    applyTheme(currentTheme);
    buildLanguageMenu();
    buildIslandCards();
    generateStars();
    generateClouds();
    generateFloatingIslands();
    applyLanguage(currentLang);
    setupEventListeners();

    setTimeout(() => {
        document.getElementById('pageLoader').classList.add('hidden');
    }, 1500);
});

function applyTheme(theme) {
    currentTheme = theme;
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('cl-theme', theme);
    const icon = document.getElementById('themeIcon');
    icon.setAttribute('data-lucide', theme === 'dark' ? 'sun' : 'moon');
    refreshLucideIcons();
}

function buildLanguageMenu() {
    const menu = document.getElementById('langMenu');
    menu.innerHTML = '';
    Object.keys(TRANSLATIONS).sort().forEach(code => {
        const opt = document.createElement('div');
        opt.className = 'lang-option' + (code === currentLang ? ' active' : '');
        opt.innerHTML = `<span>${TRANSLATIONS[code].name}</span>`;
        opt.onclick = () => { applyLanguage(code); toggleLangMenu(); };
        menu.appendChild(opt);
    });
}

function applyLanguage(code) {
    if (!TRANSLATIONS[code]) code = 'en-gb';
    currentLang = code;
    localStorage.setItem('cl-lang', code);
    const t = TRANSLATIONS[code];
    document.getElementById('currentLangName').textContent = t.name;

    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.textContent = t[key];
    });

    document.querySelectorAll('.island-card').forEach(card => {
        const id = card.getAttribute('data-id');
        if (t.cards[id]) {
            card.querySelector('.card-title').textContent = t.cards[id].title;
            const placeholder = id === 'cai' ? caiPlaceholderText() : null;
            card.querySelector('.card-desc').textContent = placeholder ? placeholder.desc : t.cards[id].desc;
            card.querySelector('.card-tag').textContent = placeholder ? placeholder.tag : t.cards[id].tag;
        }
    });
}

function buildIslandCards() {
    const grid = document.getElementById('islandsGrid');
    grid.innerHTML = ISLAND_CONFIG.map(island => {
        const placeholderClass = island.placeholder ? ' is-placeholder' : '';
        const placeholderAttr = island.placeholder ? ' data-placeholder="true"' : '';
        return `
        <a href="${island.href}" class="island-card${placeholderClass}" data-id="${island.id}" style="--card-accent: ${island.accent}"${placeholderAttr}>
            <i data-lucide="${island.icon}" class="card-icon" style="color: ${island.accent}"></i>
            <div class="card-title">${island.id}</div>
            <div class="card-desc">...</div>
            <span class="card-tag" style="color: ${island.accent}; background: ${island.accent}15">${island.id}</span>
        </a>
    `;
    }).join('');
    refreshLucideIcons();
}

function generateStars() {
    const c = document.getElementById('stars');
    for (let i = 0; i < 150; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.setProperty('--duration', (2 + Math.random() * 3) + 's');
        s.style.setProperty('--max-opacity', (0.2 + Math.random() * 0.8));
        const sz = (1 + Math.random() * 2) + 'px';
        s.style.width = sz; s.style.height = sz;
        c.appendChild(s);
    }
}

function generateClouds() {
    const c = document.getElementById('clouds');
    for (let i = 0; i < 8; i++) {
        const cl = document.createElement('div');
        cl.className = 'cloud';
        const sz = 150 + Math.random() * 250;
        cl.style.width = sz + 'px';
        cl.style.height = (sz * 0.5) + 'px';
        cl.style.top = (Math.random() * 60) + '%';
        cl.style.left = '-400px';
        cl.style.animationDuration = (40 + Math.random() * 60) + 's';
        cl.style.animationDelay = (Math.random() * 40) + 's';
        c.appendChild(cl);
    }
}

function generateFloatingIslands() {
    const c = document.getElementById('miniIslands');
    const icons = ['palmtree', 'anchor', 'waves', 'ship', 'brain'];
    for (let i = 0; i < 15; i++) {
        const el = document.createElement('div');
        el.className = 'mini-island';
        el.innerHTML = `<i data-lucide="${icons[i % icons.length]}" style="width: 35px; height: 35px; color: var(--text-accent)"></i>`;
        el.style.left = (Math.random() * 90) + '%';
        el.style.top = (20 + Math.random() * 70) + '%';
        el.style.setProperty('--speed', (20 + Math.random() * 20) + 's');
        c.appendChild(el);
    }
    refreshLucideIcons();
}

function toggleLangMenu() { document.getElementById('langMenu').classList.toggle('show'); }

function showStatusToast(message) {
    const toast = document.getElementById('statusToast');
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(showStatusToast.timer);
    showStatusToast.timer = setTimeout(() => toast.classList.remove('show'), 2400);
}

function setupEventListeners() {
    document.getElementById('themeToggle').onclick = () => applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
    document.getElementById('langBtn').onclick = (e) => { e.stopPropagation(); toggleLangMenu(); };
    window.onclick = () => document.getElementById('langMenu').classList.remove('show');

    document.addEventListener('click', (e) => {
        const placeholderCard = e.target.closest('.island-card[data-placeholder="true"]');
        if (placeholderCard) {
            e.preventDefault();
            showStatusToast(caiPlaceholderText().toast);
        }

        const rip = document.createElement('div');
        rip.className = 'ripple';
        rip.style.left = e.clientX + 'px';
        rip.style.top = e.clientY + 'px';
        document.body.appendChild(rip);
        setTimeout(() => rip.remove(), 800);
    });
}
    </script>
</body>
