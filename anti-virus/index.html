<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛡️ Safe File Scanner</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#111827;--card:#1f2937;--pri:#10b981;--tx:#f3f4f6;--bor:#374151}
[data-theme="light"]{--bg:#f0f4f8;--card:#fff;--tx:#1e293b;--bor:#e2e8f0}
body{font-family:sans-serif;background:var(--bg);color:var(--tx);text-align:center;padding:2rem;transition:.3s}
.card{background:var(--card);max-width:600px;margin:0 auto;padding:2rem;border-radius:12px;border:1px solid var(--bor);box-shadow:0 8px 30px rgba(0,0,0,.1)}
.drop{border:3px dashed var(--bor);padding:3rem;border-radius:12px;margin:1.5rem 0;cursor:pointer;position:relative;background:rgba(128,128,128,.1);transition:.3s}
.drop:hover{border-color:var(--pri)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.prog{height:10px;background:var(--bor);border-radius:5px;margin-top:1rem;display:none;overflow:hidden}
.fill{height:100%;background:var(--pri);width:0%;transition:width .1s}
.res{margin-top:1.5rem;padding:1rem;background:rgba(0,0,0,.2);border-radius:8px;word-break:break-all;display:none}
.btn{display:inline-block;margin-top:1rem;padding:.8rem 1.5rem;background:var(--pri);color:#fff;text-decoration:none;border-radius:8px;font-weight:bold;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(16,185,129,.4)}
.controls{position:absolute;top:1rem;right:1rem;display:flex;gap:.5rem}
.controls select,.controls button{background:transparent;border:1px solid var(--bor);color:var(--tx);padding:.5rem;border-radius:8px;cursor:pointer}
.controls select option{background:var(--card);color:var(--tx)}
</style>
</head>
<body>
<div class="controls">
    <select id="langSel" onchange="changeLang(this.value)">
        <option value="en">EN</option><option value="uk">UK</option>
        <option value="ru">RU</option><option value="de">DE</option>
    </select>
    <button id="themeBtn" onclick="toggleTheme()">🌓 Theme</button>
</div>
<div class="card">
    <h1 id="tTitle">🛡️ Secure Hash Scanner</h1>
    <p id="tLead" style="color:#9ca3af;font-size:0.9rem;margin-top:.5rem">
        Browsers can't hold AV databases. We generate a SHA-256 fingerprint of your file <b>offline</b> and check it against VirusTotal's database of 70+ antiviruses.
    </p>

    <div class="drop" id="drop">
        <h2 id="tDrop" style="margin-bottom:.5rem">📄 Drop file here</h2>
        <p id="tLocal" style="color:#9ca3af">File NEVER leaves your device</p>
        <input type="file" id="fi">
    </div>

    <div class="prog" id="prog"><div class="fill" id="fill"></div></div>
    <div id="stat" style="margin-top:.5rem;color:#9ca3af;font-weight:bold"></div>

    <div class="res" id="res">
        <div id="tHash" style="color:#9ca3af;font-size:.8rem;margin-bottom:.5rem">SHA-256 Hash:</div>
        <div id="hashOut" style="font-family:monospace;color:var(--pri);font-size:1.1rem"></div>
        <button id="copyBtn" class="btn" onclick="copyHash()" type="button">📋 Copy Hash</button>
        <a id="vtBtn" class="btn" href="#" target="_blank">🔍 Check on VirusTotal</a>
    </div>
</div>

<script>
const TR={
  en:{title:'🛡️ Secure Hash Scanner',lead:"Browsers can't hold AV databases. This tool generates a SHA-256 fingerprint offline and opens the matching VirusTotal report.",drop:'📄 Drop file here or click',local:'File NEVER leaves your device',theme:'🌓 Theme',hash:'SHA-256 Hash:',copy:'📋 Copy Hash',vt:'🔍 Check on VirusTotal',reading:'Reading file...',tooLarge:'⚠️ File too large for browser memory (max ~500MB).',hashing:'Calculating SHA-256...',done:'✅ Done!',copied:'Hash copied!',error:'❌ Error'},
  uk:{title:'🛡️ Безпечний сканер хешів',lead:'Браузер не може зберігати антивірусні бази. Інструмент локально створює SHA-256 відбиток файлу та відкриває відповідний звіт VirusTotal.',drop:'📄 Киньте файл сюди або натисніть',local:'Файл НІКОЛИ не залишає ваш пристрій',theme:'🌓 Тема',hash:'SHA-256 хеш:',copy:'📋 Скопіювати хеш',vt:'🔍 Перевірити у VirusTotal',reading:'Читання файлу...',tooLarge:'⚠️ Файл завеликий для памʼяті браузера (макс. ~500MB).',hashing:'Обчислення SHA-256...',done:'✅ Готово!',copied:'Хеш скопійовано!',error:'❌ Помилка'},
  ru:{title:'🛡️ Безопасный сканер хешей',lead:'Браузер не может хранить антивирусные базы. Инструмент локально создаёт SHA-256 отпечаток файла и открывает подходящий отчёт VirusTotal.',drop:'📄 Бросьте файл сюда или нажмите',local:'Файл НИКОГДА не покидает ваше устройство',theme:'🌓 Тема',hash:'SHA-256 хеш:',copy:'📋 Скопировать хеш',vt:'🔍 Проверить в VirusTotal',reading:'Чтение файла...',tooLarge:'⚠️ Файл слишком большой для памяти браузера (макс. ~500MB).',hashing:'Вычисление SHA-256...',done:'✅ Готово!',copied:'Хеш скопирован!',error:'❌ Ошибка'},
  de:{title:'🛡️ Sicherer Hash-Scanner',lead:'Browser können keine AV-Datenbanken speichern. Das Tool erzeugt lokal einen SHA-256-Fingerabdruck und öffnet den passenden VirusTotal-Bericht.',drop:'📄 Datei hier ablegen oder klicken',local:'Die Datei verlässt NIEMALS dein Gerät',theme:'🌓 Design',hash:'SHA-256-Hash:',copy:'📋 Hash kopieren',vt:'🔍 Auf VirusTotal prüfen',reading:'Datei wird gelesen...',tooLarge:'⚠️ Datei ist zu groß für den Browserspeicher (max. ~500MB).',hashing:'SHA-256 wird berechnet...',done:'✅ Fertig!',copied:'Hash kopiert!',error:'❌ Fehler'}
};
let lang=localStorage.getItem('avLang')||'en';
const t=k=>(TR[lang]&&TR[lang][k])||TR.en[k]||k;
function applyUI(){
    document.documentElement.lang=lang;
    langSel.value=lang;
    tTitle.textContent=t('title'); tLead.innerHTML=t('lead'); tDrop.textContent=t('drop');
    tLocal.textContent=t('local'); themeBtn.textContent=t('theme'); tHash.textContent=t('hash');
    copyBtn.textContent=t('copy'); vtBtn.textContent=t('vt');
}
function changeLang(l){lang=TR[l]?l:'en';localStorage.setItem('avLang',lang);applyUI()}
function toggleTheme(){
    const light=document.documentElement.getAttribute('data-theme')==='light';
    document.documentElement.setAttribute('data-theme',light?'':'light');
    localStorage.setItem('avTheme',light?'dark':'light');
}
if(localStorage.getItem('avTheme')==='light') document.documentElement.setAttribute('data-theme','light');
const fi=document.getElementById('fi'), fill=document.getElementById('fill'),
      prog=document.getElementById('prog'), stat=document.getElementById('stat'),
      res=document.getElementById('res'), hashOut=document.getElementById('hashOut'),
      vtBtn=document.getElementById('vtBtn');

fi.addEventListener('change', e=>scanFile(e.target.files[0]));

['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{
    e.preventDefault(); drop.style.borderColor='var(--pri)';
}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{
    e.preventDefault(); drop.style.borderColor='var(--bor)';
}));
drop.addEventListener('drop',e=>scanFile(e.dataTransfer.files[0]));

async function scanFile(file){
    if(!file)return;
    prog.style.display='block'; res.style.display='none'; fill.style.width='0%';
    stat.textContent=t('reading');

    if(file.size > 500*1024*1024) {
        stat.textContent=t('tooLarge');
        return;
    }

    const reader=new FileReader();
    reader.onload=async(ev)=>{
        stat.textContent=t('hashing');
        fill.style.width='50%';
        try{
            const hashBuffer=await crypto.subtle.digest('SHA-256', ev.target.result);
            const hashArr=Array.from(new Uint8Array(hashBuffer));
            const hashHex=hashArr.map(b=>b.toString(16).padStart(2,'0')).join('');

            fill.style.width='100%';
            stat.textContent=t('done');
            hashOut.textContent=hashHex;
            vtBtn.href=`https://www.virustotal.com/gui/file/${hashHex}`;
            res.style.display='block';
        }catch(err){stat.textContent=`${t('error')}: ${err.message}`;}
    };
    reader.onprogress=(ev)=>{if(ev.lengthComputable) fill.style.width=(ev.loaded/ev.total*50)+'%';};
    reader.readAsArrayBuffer(file);
}

function copyHash(){
    if(!hashOut.textContent)return;
    navigator.clipboard.writeText(hashOut.textContent);
    stat.textContent=t('copied');
}
applyUI();
</script>
</body>
</html>
